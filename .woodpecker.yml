when:
  - event: [push, manual]
    branch: main

steps:
  # Deploy only what GitHub Actions has already checked on this commit:
  # poll the *required* check runs until all conclude green (max ~45 min).
  # The required set comes from the repo's rulesets, so a run that isn't a
  # gate — a Dependabot update job or a third-party app check — can't
  # block or kill the deploy, and a renamed required job keeps it right.
  - name: wait-for-checks
    image: alpine:3.20
    commands:
      - apk add --no-cache curl jq
      - |
        req=$(for id in $(curl -fs "https://api.github.com/repos/$CI_REPO/rulesets" \
              | jq -r '.[] | select(.enforcement == "active") | .id'); do
            curl -fs "https://api.github.com/repos/$CI_REPO/rulesets/$id" \
              | jq -r '.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context'
          done | sort -u | jq -R . | jq -sc 'map(select(length > 0))')
        echo "required checks: $req"
        if [ "$req" = '[]' ]; then
          echo "no required checks found; refusing to guess" >&2; exit 1
        fi
        for i in $(seq 45); do
          j=$(curl -fs -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$CI_REPO/commits/$CI_COMMIT_SHA/check-runs?per_page=100") || exit 1
          # The latest run per required name; a rerun replaces its attempt.
          latest=$(printf %s "$j" | jq --argjson req "$req" '[.check_runs
            | sort_by(.started_at) | reverse | unique_by(.name)[]
            | select(.name as $n | $req | index($n))]')
          bad=$(printf %s "$latest" | jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not))] | .[0].name // empty')
          if [ -n "$bad" ]; then echo "required check failed: $bad" >&2; exit 1; fi
          pending=$(printf %s "$latest" | jq '[.[] | select(.status != "completed")] | length')
          total=$(printf %s "$latest" | jq length)
          needed=$(printf %s "$req" | jq length)
          if [ "$pending" = 0 ] && [ "$total" = "$needed" ]; then
            echo "all $total required checks green"; exit 0
          fi
          sleep 60
        done
        echo "timed out waiting for green checks" >&2
        exit 1

  # The deploy key is locked to a forced command on the remote host.
  - name: deploy
    image: alpine:3.20
    environment:
      DEPLOY_SSH_KEY:
        from_secret: buzzdrop_website_deploy_ssh_key
      DEPLOY_HOST:
        from_secret: buzzdrop_website_deploy_host
      DEPLOY_USER:
        from_secret: buzzdrop_website_deploy_user
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      # base64-encoded private key (base64 -w0), so the secret survives
      # being pasted into the Woodpecker UI without newline mangling.
      - printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "app $CI_COMMIT_SHA"
