name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Installs the pnpm version in package.json's packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check JS
        run: pnpm typecheck
      - name: Run JS unit tests
        run: pnpm test:unit
      - name: Run JS DOM tests
        run: pnpm test:dom
      - name: Check app.css is up to date
        run: |
          pnpm build:css
          git diff --exit-code static/css/app.css || { echo '::error::app.css is stale; run pnpm build:css and commit the result'; exit 1; }

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One decoy per secret/state pattern in .dockerignore, some nested.
      DECOYS: >-
        .env .env.local .envrc cli/.env
        buzzdrop.db buzzdrop.db-wal buzzdrop.db.bak tests/stray.db local.sqlite3 db.json
        data/buzzdrop.db uploads/blob instance/config.py server.pem server.key
        playwright-report/index.html test-results/trace.zip
        .claude/settings.json .venv/pyvenv.cfg node_modules/stray.js
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # A clean checkout has no secrets or local state, so plant decoys
      # where a developer's tree has them: .dockerignore must keep them out
      # of the image (#163). The image is built from this same context.
      - name: Plant decoy secrets and local state
        run: |
          for f in $DECOYS; do
            mkdir -p "$(dirname "$f")"
            echo decoy > "$f"
          done
      - name: Build Docker image
        run: docker build -t buzzdrop-test .
      - name: Check the image carries no secrets or local state
        run: |
          docker run --rm -e DECOYS buzzdrop-test sh -c '
            leaked=0
            for f in $DECOYS .git; do
              if [ -e "$f" ]; then echo "::error::/app/$f is in the image"; leaked=1; fi
            done
            exit $leaked'
      - name: Save Docker image
        run: docker save buzzdrop-test -o ${{ runner.temp }}/buzzdrop-test.tar
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: buzzdrop-test-image
          path: ${{ runner.temp }}/buzzdrop-test.tar
          retention-days: 1

  pytest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: buzzdrop-test-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        run: docker load -i ${{ runner.temp }}/buzzdrop-test.tar
      - name: Run pytest in Docker container
        run: docker run --rm -v ${{ github.workspace }}/uploads:/app/uploads buzzdrop-test pytest
      - name: Smoke-test db.json migration
        run: docker run --rm buzzdrop-test sh -c "echo '{\"files\":{\"1\":{\"id\":\"smoke-1\",\"original_name\":\"a.txt\",\"path\":\"uploads/smoke-1\"}},\"api_tokens\":{}}' > /tmp/db.json && python migrate_db.py --source /tmp/db.json --target /tmp/migrated.db"
      # Fixtures are rendered from the checked-out code (the same commit
      # as the image) and must match what is committed.
      - name: Check DOM fixtures are up to date
        run: |
          docker run --rm -v ${{ github.workspace }}:/app buzzdrop-test python tests/fixtures/render_dom_fixtures.py
          git status --porcelain tests/js/fixtures/
          git diff --exit-code tests/js/fixtures/
          test -z "$(git status --porcelain tests/js/fixtures/)" || { echo '::error::DOM fixtures are stale; run pnpm fixtures and commit the result'; exit 1; }
      # The contract is recorded from the checked-out app.py; a response
      # change without a re-record fails here, and js-fast then holds the
      # fake to the new recording.
      - name: Check the protocol contract is up to date
        run: |
          docker run --rm -v ${{ github.workspace }}:/app buzzdrop-test python tests/fixtures/record_protocol_contract.py
          git diff --exit-code tests/js/fixtures/protocol-contract.json || { echo '::error::The protocol contract is stale; run pnpm fixtures and commit the result'; exit 1; }

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_PORT: 5055
      # The browsers and their OS packages come with this image, so there is
      # no apt install or browser download. It must match @playwright/test
      # (tests/js/ci.test.js); a container: job can't be used, because the
      # App runs as a sibling container on the runner's Docker.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: buzzdrop-test-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        run: docker load -i ${{ runner.temp }}/buzzdrop-test.tar
      # Installs the pnpm version in package.json's packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # What playwright.config.js's webServer does locally. --init matters:
      # flask as PID 1 ignores SIGTERM, so `docker stop` would wait out its
      # timeout and kill it.
      - name: Start the App
        run: |
          docker run -d --name buzzdrop-e2e --init --env-file tests/e2e/e2e.env \
            -p 127.0.0.1:${E2E_PORT}:5000 buzzdrop-test
          for _ in $(seq 60); do
            curl -fs -o /dev/null "http://127.0.0.1:${E2E_PORT}/login" && exit 0
            sleep 1
          done
          echo '::error::the App did not come up'
          docker logs buzzdrop-e2e
          exit 1
      # Host networking, so the browsers reach the App on 127.0.0.1. The
      # runner's user keeps the report and traces in the workspace readable.
      # The image has no pnpm, so corepack fetches the packageManager one.
      - name: Run E2E tests
        run: |
          docker run --rm --init --ipc=host --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e E2E_BASE_URL="http://127.0.0.1:${E2E_PORT}" \
            -v "$PWD:/work" -w /work "$PLAYWRIGHT_IMAGE" corepack pnpm exec playwright test
      - name: Show the App's log
        if: failure()
        run: docker logs buzzdrop-e2e
      - name: Stop the App
        if: always()
        run: docker stop -t 10 buzzdrop-e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: |
            playwright-report/
            test-results/
          retention-days: 7
