name: Release CLI

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'requirements-cli.txt'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-cli-build.txt

      - name: Build binary with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name buzz \
            --strip \
            cli/buzz

      - name: Smoke-test binary
        run: |
          ./dist/buzz --help

      - name: Checksum binary
        run: |
          sha256sum dist/buzz | sed 's|dist/||' > dist/buzz.sha256
          cat dist/buzz.sha256

      # Verify with: gh attestation verify ~/.local/bin/buzz -R buzzdrop/buzzdrop
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: dist/buzz

      - name: Compute release tag
        id: tag
        run: |
          echo "tag=cli-$(date -u '+%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "buzz CLI – ${{ steps.tag.outputs.tag }}"
          body: |
            Automated release of the `buzz` CLI binary.

            ## Breaking change

            API tokens generated before Buzzdrop switched token storage to
            PBKDF2-HMAC-SHA256 are no longer accepted by this release. Generate
            a replacement token with `POST /api/token` and update
            `~/.buzz_token` before using this CLI build.

            **Triggered by commit:** ${{ github.sha }}
            **Commit message:** ${{ github.event.head_commit.message }}

            ## Installation

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/buzz -o ~/.local/bin/buzz
            chmod +x ~/.local/bin/buzz
            ```

            Verify the download (optional but recommended):

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/buzz.sha256 -o /tmp/buzz.sha256
            (cd ~/.local/bin && sha256sum -c /tmp/buzz.sha256)
            gh attestation verify ~/.local/bin/buzz -R ${{ github.repository }}
            ```

            Then create `~/.buzz_token`:
            ```json
            {"token": "YOUR_API_TOKEN", "server": "https://your-buzzdrop-instance.example.com"}
            ```

            ## Usage

            ```
            buzz file.pdf                    # generates a random 6-word passphrase
            buzz file.pdf -p my-passphrase   # use your own password
            buzz file.pdf --expiry 2025-12-31T23:59+01:00
            ```
          files: |
            dist/buzz
            dist/buzz.sha256
          fail_on_unmatched_files: true
