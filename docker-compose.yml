# Development only: the developer's local compose, not a way to run
# Buzzdrop in production. It builds from the working tree and runs the
# production image, so set FLASK_ENV=development in .env for local work.
services:
  buzzdrop:
    build: .
    container_name: buzzdrop_app
    ports:
      - "5000:5000"
    volumes:
      # Named volumes, not bind mounts: they take the image's ownership,
      # so the non-root app user (uid 10001) can write to them. The data
      # volume is a directory, so the WAL/-shm sidecars persist with the
      # database file.
      - buzzdrop-uploads:/app/uploads
      - buzzdrop-data:/app/data
    environment:
      # Overrides a DATABASE_URL from .env, so the database lands on the
      # data volume. Keep it in sync with the volume.
      - DATABASE_URL=sqlite:///data/buzzdrop.db
    env_file:
      - .env
    restart: unless-stopped

volumes:
  buzzdrop-data:
  buzzdrop-uploads:
